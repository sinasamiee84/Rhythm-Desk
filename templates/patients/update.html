{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}ویرایش بیمار | RhythmDesk{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="form-page mx-auto">
        <a class="back-link"
           href="{% url 'patients:detail' patient.pk %}">
            ← بازگشت به پرونده
        </a>

        <div class="card app-card mt-4">
            <div class="card-body p-4 p-md-5">
                <span class="eyebrow">مدیریت پرونده</span>
                <h1 class="page-title mb-2">ویرایش اطلاعات بیمار</h1>
                <p class="text-muted mb-4">
                    {{ patient.first_name }} {{ patient.last_name }}
                </p>

                <form method="post" class="patient-form">
                    {% csrf_token %}
                    <div class="form-fields">
                        {{ form|crispy }}
                    </div>

                    <div class="form-actions">
                        <a href="{% url 'patients:detail' patient.pk %}"
                           class="btn btn-outline-secondary">انصراف</a>
                        <button type="submit" class="btn btn-primary">
                            ذخیره تغییرات
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
