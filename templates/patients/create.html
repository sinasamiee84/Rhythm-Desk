{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}ثبت بیمار | RhythmDesk{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="form-page mx-auto">
        <a class="back-link" href="{% url 'patients:list' %}">← بازگشت به بیماران</a>

        <div class="card app-card mt-4">
            <div class="card-body p-4 p-md-5">
                <span class="eyebrow">پرونده جدید</span>
                <h1 class="page-title mb-2">ثبت بیمار</h1>
                <p class="text-muted mb-4">
                    اطلاعات بیمار را وارد کنید تا پروندهٔ او ساخته شود.
                </p>

                <form method="post" class="patient-form">
                    {% csrf_token %}
                    <div class="form-fields">
                        {{ form|crispy }}
                    </div>

                    <div class="form-actions">
                        <a href="{% url 'patients:list' %}"
                           class="btn btn-outline-secondary">انصراف</a>
                        <button type="submit" class="btn btn-primary">
                            ثبت بیمار
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
